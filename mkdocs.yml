site_name: AGI Frontier
site_url: https://charliememory.github.io/agi-frontier/
site_description: A reproducible map from token prediction to self-improving agents.
repo_url: https://github.com/charliememory/agi-frontier
repo_name: charliememory/agi-frontier
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: frontier-light
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: frontier-dark
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css

plugins:
  - search
  - meta
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_date
      timezone: Asia/Shanghai
  - redirects:
      redirect_maps: {}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# The production workflow supplies this public beacon token as a repository variable. Keeping the
# default empty prevents local previews and pull-request builds from being counted.
extra:
  cloudflare_analytics:
    token: !ENV [CF_WEB_ANALYTICS_TOKEN, ""]

nav:
  - Home: index.md
  - Capability Map:
      - Overview: map/index.md
      - Five Tracking Axes: map/tracking-axes.md
  - Technology Path:
      - Timeline: timeline/index.md
      - Unifying Questions: timeline/unifying-questions.md
  - Tutorials:
      - Series Guide: tutorials/index.md
      - Complete Roadmap: tutorials/roadmap.md
      - 00 · Orientation: tutorials/00-overview.md
      - 01 · Transformer and Language Modeling: tutorials/01-transformer.md
  - External Resources:
      - Resource Library: resources/index.md
  - Frontier Radar:
      - Current Radar: radar/index.md
      - Research Ledger: radar/research-ledger.md
      - Open Problems: radar/open-problems.md
  - Experiments:
      - Experiment Index: experiments/index.md
  - Maintaining the Site: maintaining.md

copyright: "© 2026 Liqian Ma · Built in public"
