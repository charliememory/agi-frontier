name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run content contract tests
        run: uv run pytest -q

      - name: Check Markdown formatting
        run: uv run mdformat --check docs README.md

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

