name: Reproduction or experiment
description: Propose a small experiment or report a reproduction result.
title: "experiment: "
labels: [experiment]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: What would you expect to observe, and what would falsify it?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Include model, data, budget, baseline, and evaluation.
    validations:
      required: true

