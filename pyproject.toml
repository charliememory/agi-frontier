[project]
name = "agi-frontier"
version = "0.1.0"
description = "A public, reproducible map of the AGI frontier."
requires-python = ">=3.12,<3.14"
dependencies = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.0",
  "mkdocs-git-revision-date-localized-plugin==1.4.7",
  "mkdocs-minify-plugin==0.8.0",
  "mkdocs-redirects==1.2.2",
  "pymdown-extensions==10.16.1",
]

[dependency-groups]
dev = [
  "mdformat==1.0.0",
  "mdformat-frontmatter==2.1.2",
  "mdformat-gfm==1.0.0",
  "mdformat-mkdocs==5.3.0",
  "pre-commit==4.3.0",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
